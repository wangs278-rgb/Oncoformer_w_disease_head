defaults:
    - omics: fusion
    - metadata: caris_claims
    - training: fusion
    - override /omics/modalities/dna/architecture: mlm_4_layer_caris
    - override /omics/modalities/dna/data: caris_claims

anndata: ./datasets/caris/rna_claims.h5ad
sample_metadata_path: ./datasets/sample_metadata.pkl
data_file_prefix: fusion_caris_claims_transferred_

sample_index:
    join: intersection
    id_column: { dna: SampleID, rna: index }

# Transferred weights settings (inlined from deprecated fusion_transferred.yaml)
omics:
    architecture:
        dropout: 0.2
        stitch:
            dropout: 0.1
            gate_init: 0.0
