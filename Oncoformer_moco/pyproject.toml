[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["oncoformer"]

[project]
name = "Oncoformer"
description = "Oncoformer multimodal transformer for oncology"
version = "0.0.1"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Tim Sterne-Weiler", email = "sternewt@gene.com"},
    {name = "Michal Kabza", email = "michal.kabza@contractors.roche.com"}
]
maintainers = [
    {name = "Tim Sterne-Weiler", email = "sternewt@gene.com"},
    {name = "Michal Kabza", email = "michal.kabza@contractors.roche.com"}
]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
    "pLM_mutations>=0.0.1",
    "numpy>=2.2.6",
    "pandas>=2.3.2",
    "torch==2.3.0",
    "scikit-learn>=1.7.2",
    "umap-learn>=0.5.9.post2",
    "matplotlib>=3.10.6",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.2",
    "ninja>=1.13.0",
    "lmdb>=1.7.3",
    "anndata>=0.11.4",
    "scanpy>=1.11.4",
    "pydeseq2>=0.5.2",
    "scvi-tools>=0.20.3",
    "igraph>=0.11.9",
    "leidenalg>=0.10.2",
    "lightning>=2.5.5",
    "transformers>=4.56.1",
    "tqdm>=4.67.1"
]

[project.urls]
Source = "https://github.com/sternewt_roche/Oncoformer"

[project.optional-dependencies]
test = [
    "pytest>=8.4.2"
]
build = [
    "build>=1.3.0"
]
jupyter = [
    "ipykernel>=6.30.1",
    "nbformat>=5.10.4",
    "ipywidgets>=8.1.7"
]
